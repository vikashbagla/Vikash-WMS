<!-- Reports Module HTML -->
<head>
<style id="reports-styles">
/* ================================================================
   REPORTS MODULE STYLES
   ================================================================ */

.reports-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
}

/* Header bar */
.reports-header-bar {
    flex-shrink: 0;
    background: #fff;
    padding: 8px 0;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0;
}
.reports-header-bar h2 {
    margin: 0;
    font-size: 15px;
    color: #2d3748;
    display: inline;
}
.reports-header-bar .rpt-unit-desc {
    font-size: 11px;
    color: #718096;
    margin-left: 8px;
}

/* Tabs */
.reports-tabs {
    flex-shrink: 0;
    display: flex;
    gap: 0;
    border-bottom: 2px solid #e2e8f0;
    background: #fff;
    padding: 0 4px;
}
.reports-tab-btn {
    padding: 8px 20px;
    border: none;
    background: none;
    font-size: 13px;
    font-weight: 600;
    color: #718096;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: color 0.15s, border-color 0.15s;
}
.reports-tab-btn:hover { color: #4a5568; }
.reports-tab-btn.active {
    color: #667eea;
    border-bottom-color: #667eea;
}

/* Tab content */
.reports-tab-content { display: none; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
.reports-tab-content.active { display: flex; }

/* Asset class group header row (inside <table>) */
.rpt-group-header-row td {
    border-bottom: 1px solid #cbd5e0;
}
.rpt-group-header-row:hover {
    background: #e8ecf1 !important;
}
/* Data rows — light separator */
.rpt-data-row td {
    border-bottom: 1px solid #f0f4f8;
}
.rpt-data-row:hover {
    background: #fafbfc;
}

/* Capital Gains styles */
.rpt-cg-summary-cards {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    flex-shrink: 0;
    flex-wrap: wrap;
}
.rpt-cg-card {
    flex: 1;
    min-width: 160px;
    background: #f7fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 12px 16px;
    text-align: center;
}
.rpt-cg-card-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #718096;
    margin-bottom: 4px;
}
.rpt-cg-card-value {
    font-size: 16px;
    font-weight: 700;
    color: #2d3748;
}
.rpt-cg-card-sub {
    font-size: 11px;
    color: #a0aec0;
    margin-top: 2px;
}

/* FY selector */
.rpt-fy-selector {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    padding: 8px 0;
}
.rpt-fy-selector label {
    font-size: 12px;
    font-weight: 600;
    color: #4a5568;
}
.rpt-fy-selector select {
    font-size: 12px;
    padding: 4px 8px;
    border: 1px solid #e2e8f0;
    border-radius: 5px;
    background: #fff;
    color: #2d3748;
}

/* CG detail table tweaks */
.rpt-cg-table th { font-size: 11px; }
.rpt-cg-table td { font-size: 12px; }
.rpt-cg-type-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.3px;
}
.rpt-cg-type-badge.ltcg { background: #d1fae5; color: #065f46; }
.rpt-cg-type-badge.stcg { background: #fef3c7; color: #92400e; }
</style>
</head>

<div class="reports-container">
    <!-- Header -->
    <div class="reports-header-bar">
        <div>
            <h2>Reports</h2>
            <span class="rpt-unit-desc" id="rpt-unit-desc"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span id="rpt-price-status" style="font-size: 12px; color: #718096;"></span>
            <button class="btn-refresh" onclick="rptRefresh()" title="Refresh data">🔄 Refresh</button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="reports-tabs" id="rptTabs">
        <button class="reports-tab-btn active" data-tab="rpt-portfolio">Portfolio</button>
        <button class="reports-tab-btn" data-tab="rpt-capgains">Capital Gains</button>
    </div>

    <!-- Tab: Portfolio Holdings (FIFO, grouped by Asset Class, no F&O) -->
    <div id="rpt-portfolio" class="reports-tab-content active">
        <!-- Filters (pill-based, built by wmsPillSearch in reports.js) -->
        <div id="rptPortfolioFilters" style="flex-shrink:0; display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px solid #e2e8f0;">
            <div class="filters-grid" style="flex:1; grid-template-columns: repeat(3, 1fr);">
                <div id="rpt-filter-investor"></div>
                <div id="rpt-filter-broker"></div>
                <div id="rpt-filter-tag"></div>
            </div>
            <div style="margin-top:12px;">
                <button class="btn-toggle-zero" id="rptToggleZeroBtn" onclick="rptToggleZero()" title="Show/hide zero quantity holdings">
                    👁 Show Zero
                </button>
            </div>
        </div>

        <!-- Grouped holdings container (scrollable) -->
        <div class="table-container" id="rptPortfolioBody" style="flex:1; min-height:0; overflow:auto;">
            <div style="text-align:center;padding:40px;color:#9ca3af;">Loading portfolio data...</div>
        </div>

        <!-- Summary Cards -->
        <div class="summary-cards" id="rpt-portfolio-summary"></div>
    </div>

    <!-- Tab: Capital Gains -->
    <div id="rpt-capgains" class="reports-tab-content">
        <!-- FY selector + summary cards -->
        <div class="rpt-fy-selector">
            <label>Financial Year:</label>
            <select id="rpt-fy-select" onchange="rptRenderCapGains()"></select>
            <span style="font-size:11px; color:#a0aec0; margin-left:8px;">(April to March)</span>
        </div>

        <!-- Filters for Capital Gains -->
        <div id="rptCGFilters" style="flex-shrink:0; display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px solid #e2e8f0;">
            <div class="filters-grid" style="flex:1; grid-template-columns: repeat(2, 1fr);">
                <!-- Investor Filter -->
                <div class="filter-group">
                    <div class="filter-header">
                        <label>Filter by Investor</label>
                        <span class="clear-link" onclick="rptCGClearFilter('investor')">Clear all</span>
                    </div>
                    <div class="filter-search-container">
                        <input type="text" class="filter-search-input" id="rpt-cg-investor-search"
                               placeholder="Type to search investors..."
                               oninput="rptCGFilterSearch('investor')"
                               onclick="rptCGShowDropdown('investor')">
                        <div class="filter-dropdown" id="rpt-cg-investor-dropdown"></div>
                    </div>
                    <div class="filter-selected-tags" id="rpt-cg-selected-investors"></div>
                </div>
                <!-- Broker Filter -->
                <div class="filter-group">
                    <div class="filter-header">
                        <label>Filter by Broker</label>
                        <span class="clear-link" onclick="rptCGClearFilter('broker')">Clear all</span>
                    </div>
                    <div class="filter-search-container">
                        <input type="text" class="filter-search-input" id="rpt-cg-broker-search"
                               placeholder="Type to search brokers..."
                               oninput="rptCGFilterSearch('broker')"
                               onclick="rptCGShowDropdown('broker')">
                        <div class="filter-dropdown" id="rpt-cg-broker-dropdown"></div>
                    </div>
                    <div class="filter-selected-tags" id="rpt-cg-selected-brokers"></div>
                </div>
            </div>
        </div>

        <div class="rpt-cg-summary-cards" id="rpt-cg-summary"></div>

        <!-- CG detail table (scrollable) -->
        <div class="table-container" id="rptCGBody" style="flex:1; min-height:0; overflow:auto;">
            <div style="text-align:center;padding:40px;color:#9ca3af;">Select a financial year to view capital gains...</div>
        </div>
    </div>
</div>
