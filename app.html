<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Wealth Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <link rel="stylesheet" id="app-styles-link" href="app-styles.css">
</head>
<body>
    <div id="loading-indicator" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <div id="alert-container" class="alert-container"></div>

    <header class="app-header">
        <div class="header-content">
            <div class="logo-section">
                <h1>💼 WMS</h1>
                <span class="tagline">Wealth Management System</span>
            </div>
            <div class="index-ticker" id="indexTicker">
                <div class="index-item" id="idx-nifty">
                    <div class="index-top"><span class="index-name">NIFTY</span><span class="index-price" id="idx-nifty-price">—</span></div>
                    <div class="index-bottom"><span class="index-change neutral" id="idx-nifty-change"></span></div>
                </div>
                <div class="index-item" id="idx-banknifty">
                    <div class="index-top"><span class="index-name">BANKNIFTY</span><span class="index-price" id="idx-banknifty-price">—</span></div>
                    <div class="index-bottom"><span class="index-change neutral" id="idx-banknifty-change"></span></div>
                </div>
                <div class="index-item" id="idx-sensex">
                    <div class="index-top"><span class="index-name">SENSEX</span><span class="index-price" id="idx-sensex-price">—</span></div>
                    <div class="index-bottom"><span class="index-change neutral" id="idx-sensex-change"></span></div>
                </div>
                <div class="index-item" id="idx-gold">
                    <div class="index-top"><span class="index-name">GOLD</span><span class="index-price" id="idx-gold-price">—</span></div>
                    <div class="index-bottom"><span class="index-change neutral" id="idx-gold-change"></span></div>
                </div>
            </div>
            <div class="user-section">
                <span id="fyers-status" style="font-size:12px; margin-right:16px;">⏳ Fyers...</span>
                <span class="user-email" id="user-email">Loading...</span>
                <button class="btn-logout" id="logoutBtn" title="Logout">⏻</button>
            </div>
        </div>
    </header>

    <nav class="top-nav">
        <div class="nav-content">
            <button class="nav-btn active" data-module="portfolio">📊 Portfolio</button>
            <button class="nav-btn" data-module="master-data">🗂️ Master Database</button>
            <button class="nav-btn" data-module="import-transactions">📥 Import Transactions</button>
            <button class="nav-btn" data-module="trading">📈 Trading</button>
            <button class="nav-btn disabled" data-module="add-transaction">➕ Add Transaction</button>
            <button class="nav-btn disabled" data-module="other-transactions">📋 Other Transactions</button>
            <button class="nav-btn disabled" data-module="analytics">📊 Analytics</button>
        </div>
    </nav>

    <main class="main-content">
        <div id="content-container" class="content-container"></div>
    </main>

    <script>
    // Global configuration - ONLY DECLARED ONCE
    window.SUPABASE_URL = 'https://lynvrwteylgpwlwbslse.supabase.co';
    window.SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5bnZyd3RleWxncHdsd2JzbHNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwOTI4NDMsImV4cCI6MjA4NTY2ODg0M30.zHMouEjak_Fpd9LBqHbSOifVfSCZ0U8AqrX94C9oKXc';
    
    // Initialize Supabase
    const { createClient } = supabase;
    window.supabaseClient = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    
    let currentModule = null;
    window.currentUser = null;

    // ============================================================
    // FYERS TOKEN MANAGEMENT
    // ============================================================

    // Get today's token from localStorage if still valid
    function getFyersToken() {
        try {
            const stored = localStorage.getItem('fyers_token');
            if (!stored) return null;
            const { token, date } = JSON.parse(stored);
            const today = new Date().toISOString().split('T')[0];
            if (date === today && token) return token;
            return null; // expired (different date)
        } catch (e) {
            return null;
        }
    }

    // Call Fyers via Supabase Edge Function
    // Pass the locally stored token in the request body
    window.fyersCall = async function(payload) {
        const stored = localStorage.getItem('fyers_token');
        let fyersToken = null;
        if (stored) {
            try {
                const { token, date } = JSON.parse(stored);
                const today = new Date().toISOString().split('T')[0];
                if (date === today) fyersToken = token;
            } catch(e) {}
        }

        const response = await fetch(`${window.SUPABASE_URL}/functions/v1/fyers-market-data`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${window.SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({ ...payload, accessToken: fyersToken })
        });
        return await response.json();
    };

    // Check Fyers token on app load - redirect to OAuth if needed
    function checkFyersAuth() {
        const token = getFyersToken();
        if (token) {
            window.fyersToken = token;
            console.log('✅ Fyers token valid for today');
            document.getElementById('fyers-status').innerHTML = '🟢 Fyers Connected';
            document.getElementById('fyers-status').style.color = '#059669';
        } else {
            window.fyersToken = null;
            document.getElementById('fyers-status').innerHTML = 
                '🔴 <a href="fyers-oauth.html" style="color:#dc2626;font-weight:600;">Connect Fyers</a>';
            console.log('⚠️ Fyers token missing or expired');
        }
    }

    // ============================================================
    // INDEX TICKER
    // ============================================================

    // ---- Gold symbol resolver (auto-detects active near-month contract) ----
    var _resolvedGoldSymbol = null;

    function buildGoldCandidates() {
        var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
        var now = new Date();
        var candidates = [];
        for (var i = 0; i < 4; i++) {
            var d = new Date(now.getFullYear(), now.getMonth() + i, 1);
            var yy = String(d.getFullYear()).slice(2);
            candidates.push('MCX:GOLDM' + yy + months[d.getMonth()] + 'FUT');
        }
        return candidates;
    }

    async function resolveGoldSymbol() {
        if (_resolvedGoldSymbol) return _resolvedGoldSymbol;
        var candidates = buildGoldCandidates();
        for (var i = 0; i < candidates.length; i++) {
            try {
                var res = await window.fyersCall({ action: 'quotes', symbols: [candidates[i]] });
                if (res && res.d && res.d[0] && res.d[0].v && res.d[0].v.lp > 0) {
                    _resolvedGoldSymbol = candidates[i];
                    console.log('✅ Gold symbol resolved:', _resolvedGoldSymbol);
                    return _resolvedGoldSymbol;
                }
            } catch(e) {}
        }
        return candidates[0]; // fallback to first candidate
    }

    // ---- Fetch and display NIFTY, BANKNIFTY, SENSEX, GOLD prices ----
    async function fetchIndexPrices() {
        try {
            var token = getFyersToken();
            if (!token) return;

            // Resolve gold symbol (cached after first success)
            var goldSym = await resolveGoldSymbol();

            var symbols = [
                'NSE:NIFTY50-INDEX',
                'NSE:NIFTYBANK-INDEX',
                'BSE:SENSEX-INDEX',
                goldSym
            ];

            var result = await window.fyersCall({ action: 'quotes', symbols: symbols });
            if (!result || !result.d) return;

            // Dynamic mapping — gold symbol may vary
            var mapping = {
                'NSE:NIFTY50-INDEX':    'nifty',
                'NSE:NIFTYBANK-INDEX':  'banknifty',
                'BSE:SENSEX-INDEX':     'sensex'
            };
            mapping[goldSym] = 'gold';

            result.d.forEach(function(q) {
                var key = mapping[q.n];
                if (!key || !q.v) return;

                var lp = q.v.lp;
                var ch = q.v.ch;
                var chp = q.v.chp;

                var priceEl = document.getElementById('idx-' + key + '-price');
                var changeEl = document.getElementById('idx-' + key + '-change');
                if (!priceEl || !changeEl) return;

                // Price — must be > 0 to display
                var decimals = key === 'gold' ? 0 : 1;
                priceEl.textContent = (lp && lp > 0) ? Number(lp).toLocaleString('en-IN', { maximumFractionDigits: decimals }) : '—';

                // Change (sub-row)
                if (ch !== undefined && chp !== undefined && lp > 0) {
                    var sign = ch >= 0 ? '+' : '';
                    var colorClass = ch > 0 ? 'positive' : ch < 0 ? 'negative' : 'neutral';
                    changeEl.textContent = sign + Number(ch).toFixed(decimals) + ' (' + sign + Number(chp).toFixed(2) + '%)';
                    changeEl.className = 'index-change ' + colorClass;
                } else {
                    changeEl.textContent = '';
                    changeEl.className = 'index-change neutral';
                }
            });
        } catch (e) {
            console.log('Index ticker fetch error:', e);
        }
    }

    // Refresh index prices every 30 seconds
    var _indexRefreshTimer = null;
    function startIndexRefresh() {
        fetchIndexPrices();
        _indexRefreshTimer = setInterval(fetchIndexPrices, 30000);
    }

    // ============================================================
    // AUTH
    // ============================================================
    function checkAuth() {
        const savedUser = localStorage.getItem('wms_user');
        if (!savedUser) {
            window.location.href = 'index.html';
            return false;
        }
        
        try {
            window.currentUser = JSON.parse(savedUser);
            const name = window.currentUser.display_name || window.currentUser.name || window.currentUser.username || window.currentUser.email || 'User';
            document.getElementById('user-email').textContent = name;
            return true;
        } catch (e) {
            localStorage.removeItem('wms_user');
            window.location.href = 'index.html';
            return false;
        }
    }

    // Logout
    function logout() {
        if (confirm('Logout?')) {
            localStorage.removeItem('wms_user');
            window.location.href = 'index.html';
        }
    }

    // Helper to inject a module's HTML + styles into the container
    function injectModule(html, container) {
        const parsed = new DOMParser().parseFromString(html, 'text/html');
        // Inject any <style> tags from <head>
        parsed.querySelectorAll('head style').forEach(style => {
            const existing = document.getElementById(style.id);
            if (existing) existing.remove();
            document.head.appendChild(style.cloneNode(true));
        });
        container.innerHTML = parsed.body.innerHTML;
    }

    // Helper to load a script dynamically
    function loadScript(src) {
        return new Promise((resolve, reject) => {
            // Remove old instance if exists
            const old = document.querySelector(`script[src="${src}"]`);
            if (old) old.remove();

            const script = document.createElement('script');
            script.src = src + '?t=' + Date.now(); // cache bust
            script.onload = resolve;
            script.onerror = reject;
            document.body.appendChild(script);
        });
    }

    // Load module
    async function loadModule(moduleName) {
        if (currentModule === moduleName) return;
        currentModule = moduleName;
        localStorage.setItem('wms_last_module', moduleName);  // Remember current module
        
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-module="${moduleName}"]`).classList.add('active');
        
        const container = document.getElementById('content-container');
        container.innerHTML = '<div class="loading-module">Loading...</div>';
        
        try {
            if (moduleName === 'portfolio') {
                const resp = await fetch('portfolio.html');
                container.innerHTML = await resp.text();
                if (typeof initPortfolio === 'function') await initPortfolio();

            } else if (moduleName === 'master-data') {
                const html = await (await fetch('master-data.html')).text();
                injectModule(html, container);
                await loadScript('master-data.js');
                if (typeof initMasterData === 'function') initMasterData();

            } else if (moduleName === 'import-transactions') {
                const html = await (await fetch('transaction-import.html')).text();
                injectModule(html, container);
                await loadScript('transaction-import.js');
                if (typeof initTransactionImport === 'function') initTransactionImport();

            } else if (moduleName === 'trading') {
                const html = await (await fetch('trading.html')).text();
                injectModule(html, container);
                await loadScript('trading.js');
                if (typeof initTrading === 'function') initTrading();

            } else {
                container.innerHTML = '<div class="coming-soon">🚧 Coming soon!</div>';
            }
        } catch (e) {
            container.innerHTML = '<div class="error-message">Error loading module: ' + e.message + '</div>';
            console.error('Module load error:', e);
        }
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => {
        if (!checkAuth()) return;
        checkFyersAuth();
        startIndexRefresh(); // Start index ticker
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.querySelectorAll('.nav-btn:not(.disabled)').forEach(btn => {
            btn.addEventListener('click', () => loadModule(btn.dataset.module));
        });
        // Load last active module or default to portfolio
        const lastModule = localStorage.getItem('wms_last_module') || 'portfolio';
        loadModule(lastModule);
    });
    </script>
    
    <script>
    // Cache busting - auto version by date so deployments always load fresh files
    const _v = Date.now();
    document.getElementById('app-styles-link').href = `app-styles.css?v=${_v}`;
    document.write(`<script src="utils.js?v=${_v}"><\/script>`);
    document.write(`<script src="portfolio.js?v=${_v}"><\/script>`);
    </script>
</body>
</html>
