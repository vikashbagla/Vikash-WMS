<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Wealth Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="app-styles.css">
</head>
<body>
    <div id="loading-indicator" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <div id="alert-container" class="alert-container"></div>

    <header class="app-header">
        <div class="header-content">
            <div class="logo-section">
                <h1>💼 WMS</h1>
                <span class="tagline">Wealth Management System</span>
            </div>
            <div class="user-section">
                <span class="user-email" id="user-email">Loading...</span>
                <button class="btn-logout" id="logoutBtn">Logout</button>
            </div>
        </div>
    </header>

    <nav class="top-nav">
        <div class="nav-content">
            <button class="nav-btn active" data-module="portfolio">📊 Portfolio</button>
            <button class="nav-btn" data-module="master-data">🗂️ Master Database</button>
            <button class="nav-btn" data-module="import-transactions">📥 Import Transactions</button>
            <button class="nav-btn disabled" data-module="add-transaction">➕ Add Transaction</button>
            <button class="nav-btn disabled" data-module="other-transactions">📋 Other Transactions</button>
            <button class="nav-btn disabled" data-module="analytics">📈 Analytics</button>
        </div>
    </nav>

    <main class="main-content">
        <div id="content-container" class="content-container"></div>
    </main>

    <footer class="app-footer">
        <p>WMS v6.0 • <span id="db-status">📊 Connected</span></p>
    </footer>

    <script>
    // Global configuration - ONLY DECLARED ONCE
    window.SUPABASE_URL = 'https://lynvrwteylgpwlwbslse.supabase.co';
    window.SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5bnZyd3RleWxncHdsd2JzbHNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwOTI4NDMsImV4cCI6MjA4NTY2ODg0M30.zHMouEjak_Fpd9LBqHbSOifVfSCZ0U8AqrX94C9oKXc';
    
    // Initialize Supabase
    const { createClient } = supabase;
    window.supabaseClient = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    
    let currentModule = null;
    let currentUser = null;

    // Check auth
    function checkAuth() {
        const savedUser = localStorage.getItem('wms_user');
        if (!savedUser) {
            window.location.href = 'index.html';
            return false;
        }
        
        try {
            currentUser = JSON.parse(savedUser);
            const name = currentUser.display_name || currentUser.name || currentUser.username || currentUser.email || 'User';
            document.getElementById('user-email').textContent = name;
            return true;
        } catch (e) {
            localStorage.removeItem('wms_user');
            window.location.href = 'index.html';
            return false;
        }
    }

    // Logout
    function logout() {
        if (confirm('Logout?')) {
            localStorage.removeItem('wms_user');
            window.location.href = 'index.html';
        }
    }

    // Load module
    async function loadModule(moduleName) {
        if (currentModule === moduleName) return;
        currentModule = moduleName;
        
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`[data-module="${moduleName}"]`).classList.add('active');
        
        const container = document.getElementById('content-container');
        
        try {
            if (moduleName === 'portfolio') {
                const resp = await fetch('portfolio.html');
                container.innerHTML = await resp.text();
                if (typeof initPortfolio === 'function') await initPortfolio();
            } else if (moduleName === 'master-data') {
                const resp = await fetch('master-data.html');
                const html = await resp.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                container.innerHTML = doc.body.innerHTML;
            } else if (moduleName === 'import-transactions') {
                const resp = await fetch('transaction-import.html');
                const html = await resp.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                container.innerHTML = doc.body.innerHTML;
            } else {
                container.innerHTML = '<div class="coming-soon">🚧 Coming soon!</div>';
            }
        } catch (e) {
            container.innerHTML = '<div class="error-message">Error: ' + e.message + '</div>';
        }
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => {
        if (!checkAuth()) return;
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.querySelectorAll('.nav-btn:not(.disabled)').forEach(btn => {
            btn.addEventListener('click', () => loadModule(btn.dataset.module));
        });
        loadModule('portfolio');
    });
    </script>
    
    <script src="utils.js"></script>
    <script src="portfolio.js"></script>
</body>
</html>
