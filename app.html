    <script>
    // Global configuration - ONLY DECLARED ONCE
    window.SUPABASE_URL = 'https://lynvrwteylgpwlwbslse.supabase.co';
    window.SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5bnZyd3RleWxncHdsd2JzbHNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwOTI4NDMsImV4cCI6MjA4NTY2ODg0M30.zHMouEjak_Fpd9LBqHbSOifVfSCZ0U8AqrX94C9oKXc';

    // ============================================================
    // ENVIRONMENT DETECTION
    // 'dev' when running on Netlify dev site, 'prod' otherwise.
    // Dev environment routes transactions & ledger_entries queries
    // to _dev copies of those tables so production data is safe.
    // Master tables (investors, brokers, securities, etc.) are shared.
    // ============================================================
    window.WMS_ENV = (function() {
        var host = window.location.hostname;
        if (host.includes('netlify.app') || host.includes('netlify.live') || host.includes('pages.dev')) return 'dev';
        if (host === 'localhost' || host === '127.0.0.1') return 'dev';
        return 'prod';
    })();

    // Fetch interceptor — transparently rewrites table names for dev env.
    // No module code changes needed; all REST URLs pass through here.
    if (window.WMS_ENV === 'dev') {
        (function() {
            var _origFetch = window.fetch;
            window.fetch = function(url, opts) {
                if (typeof url === 'string' && url.indexOf('/rest/v1/') !== -1) {
                    url = url.replace(/\/rest\/v1\/transactions(?=\?|$)/, '/rest/v1/transactions_dev');
                    url = url.replace(/\/rest\/v1\/ledger_entries(?=\?|$)/, '/rest/v1/ledger_entries_dev');
                }
                return _origFetch.call(this, url, opts);
            };
        })();
    }

    // Initialize Supabase
    const { createClient } = supabase;
    window.supabaseClient = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    let currentModule = null;
    window.currentUser = null;

    // ============================================================
    // FYERS TOKEN MANAGEMENT
    // ============================================================

    // Get today's token from localStorage if still valid
    function getFyersToken() {
        try {
            const stored = localStorage.getItem('fyers_token');
            if (!stored) return null;
            const { token, date } = JSON.parse(stored);
            const today = new Date().toISOString().split('T')[0];
            if (date === today && token) return token;
            return null; // expired (different date)
        } catch (e) {
            return null;
        }
    }

    // Call Fyers via Supabase Edge Function
    // Pass the locally stored token in the request body
    window.fyersCall = async function(payload) {
        const stored = localStorage.getItem('fyers_token');
        let fyersToken = null;
        if (stored) {
            try {
                const { token, date } = JSON.parse(stored);
                const today = new Date().toISOString().split('T')[0];
                if (date === today) fyersToken = token;
            } catch(e) {}
        }

        // Edge functions use SERVICE_ROLE_KEY internally; always auth with anon key
        const response = await fetch(`${window.SUPABASE_URL}/functions/v1/fyers-market-data`, {
            method: 'POST',
            headers: wmsEdgeHeaders({'Content-Type': 'application/json'}),
            body: JSON.stringify({ ...payload, accessToken: fyersToken })
        });
        return await response.json();
    };

    // Check for today's token in investor_broker_accounts (auto-login)
    async function checkFyersDbToken() {
        try {
            const today = new Date().toISOString().split('T')[0];
            const res = await fetch(
                `${window.SUPABASE_URL}/rest/v1/investor_broker_accounts?api_token_date=eq.${today}&api_access_token=not.is.null&select=api_access_token,api_token_method,api_token_generated_at,api_last_error&limit=1`,
                { headers: wmsHeaders() }
            );
            if (!res.ok) return null;
            const rows = await res.json();
            if (rows && rows.length > 0 && rows[0].api_access_token) return rows[0];
        } catch (e) {
            console.warn('DB token check failed:', e);
        }
        return null;
    }

    // Run the Fyers login SERVER-SIDE via the fyers-auto-login Edge Function —
    // the exact same path the daily cron uses. The EF owns FYERS_APP_ID /
    // FYERS_SECRET / FYERS_TOTP_SECRET and writes api_access_token +
    // api_token_date into investor_broker_accounts itself, so the browser never
    // handles an app id or a secret.
    //
    // Deliberately NOT a second copy of the OAuth flow: the old fyers-oauth.html
    // replicated it, kept its own hardcoded APP_ID, missed the -100 → -200 SEBI
    // App-ID migration, and failed silently (2026-07-20 — live order rejected
    // with NO_BROKER_TOKEN). One owning implementation, no drift. LESSONS §B.4.9.
    window.wmsFyersRefresh = async function () {
        const statusEl = document.getElementById('fyers-status');
        const prevHtml = statusEl ? statusEl.innerHTML : '';
        if (statusEl) {
            statusEl.innerHTML = '⏳ Fyers…';
            statusEl.style.color = '#b45309';
        }
        try {
            const res = await fetch(`${window.SUPABASE_URL}/functions/v1/fyers-auto-login`, {
                method: 'POST',
                headers: wmsEdgeHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({ action: 'auto_login' })
            });
            let out = {};
            try { out = await res.json(); } catch (_e) { /* non-JSON error body */ }

            // Never report success without checking the response — the retired page
            // logged "✅ saved" unconditionally, which is exactly why a failed login
            // looked like it had worked. LESSONS §A.1.9f.
            if (!res.ok || out.success !== true) {
                const msg = out.error || `HTTP ${res.status} ${res.statusText || ''}`.trim();
                console.error('Fyers auto-login failed:', msg);
                if (statusEl) { statusEl.innerHTML = prevHtml; statusEl.style.color = '#dc2626'; }
                alert('Fyers auto-login FAILED.\n\n' + msg +
                      '\n\nThe token was NOT refreshed — live order placement will be ' +
                      'rejected with NO_BROKER_TOKEN until this succeeds.');
                return false;
            }
            console.log('✅ Fyers auto-login succeeded:', out.message || '');
        } catch (e) {
            console.error('Fyers auto-login request failed:', e);
            if (statusEl) { statusEl.innerHTML = prevHtml; statusEl.style.color = '#dc2626'; }
            alert('Fyers auto-login request failed.\n\n' + (e && e.message ? e.message : e));
            return false;
        }
        await checkFyersAuth();   // re-read from the DB and repaint the indicator
        return false;             // stay on the page
    };

    // Check Fyers token on app load
    // Priority: localStorage (manual OAuth) → DB (auto-login) → not connected
    async function checkFyersAuth() {
        const statusEl = document.getElementById('fyers-status');

        // 1. Check localStorage first (manual OAuth)
        const localToken = getFyersToken();
        if (localToken) {
            window.fyersToken = localToken;
            console.log('✅ Fyers token valid for today (localStorage)');
            statusEl.innerHTML = '🟢 Fyers';
            statusEl.style.color = '#059669';
            return;
        }

        // 2. Check DB for auto-login token
        const dbRow = await checkFyersDbToken();
        if (dbRow && dbRow.api_access_token) {
            // Auto-login token exists — edge function will use it automatically
            window.fyersToken = 'db';  // truthy flag; actual token used server-side
            const method = dbRow.api_token_method === 'auto' ? 'auto-login' : 'manual';
            console.log(`✅ Fyers token valid for today (DB, ${method})`);
            statusEl.innerHTML = '🟢 Fyers <span style="font-size:9px;color:#6b7280;">(auto)</span>';
            statusEl.style.color = '#059669';
            return;
        }

        // 3. No token available — one click runs the same server-side login the
        //    daily cron runs (fyers-auto-login EF). No credentials in the browser.
        window.fyersToken = null;
        statusEl.innerHTML =
            '🔴 <a href="#" onclick="return wmsFyersRefresh()" title="Run Fyers auto-login now" style="color:#dc2626;font-weight:600;">Fyers</a>';
        statusEl.style.color = '#dc2626';
        console.log('⚠️ Fyers token missing or expired');
    }

    // ============================================================
    // INDEX TICKER
    // ============================================================

    // ---- Gold symbol resolver (auto-detects active near-month contract) ----
    var _resolvedGoldSymbol = null;

    function buildGoldCandidates() {
        var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
        var now = new Date();
        var candidates = [];
        for (var i = 0; i < 4; i++) {
            var d = new Date(now.getFullYear(), now.getMonth() + i, 1);
            var yy = String(d.getFullYear()).slice(2);
            candidates.push('MCX:GOLDM' + yy + months[d.getMonth()] + 'FUT');
        }
        return candidates;
    }

    async function resolveGoldSymbol() {
        if (_resolvedGoldSymbol) return _resolvedGoldSymbol;
        var candidates = buildGoldCandidates();
        for (var i = 0; i < candidates.length; i++) {
            try {
                var res = await window.fyersCall({ action: 'quotes', symbols: [candidates[i]] });
                if (res && res.d && res.d[0] && res.d[0].v && res.d[0].v.lp > 0) {
                    _resolvedGoldSymbol = candidates[i];
                    console.log('✅ Gold symbol resolved:', _resolvedGoldSymbol);
                    return _resolvedGoldSymbol;
                }
            } catch(e) {}
        }
        return candidates[0]; // fallback to first candidate
    }

    // ---- Fetch and display NIFTY, BANKNIFTY, SENSEX, GOLD prices ----
    async function fetchIndexPrices() {
        try {
            // Check localStorage token OR DB token (auto-login sets window.fyersToken = 'db')
            var token = getFyersToken() || window.fyersToken;
            if (!token) return;

            // Resolve gold symbol (cached after first success)
            var goldSym = await resolveGoldSymbol();

            var symbols = [
                'NSE:NIFTY50-INDEX',
                'NSE:NIFTYBANK-INDEX',
                'BSE:SENSEX-INDEX',
                goldSym
            ];

            var result = await window.fyersCall({ action: 'quotes', symbols: symbols });
            if (!result || !result.d) return;

            // Dynamic mapping — gold symbol may vary
            var mapping = {
                'NSE:NIFTY50-INDEX':    'nifty',
                'NSE:NIFTYBANK-INDEX':  'banknifty',
                'BSE:SENSEX-INDEX':     'sensex'
            };
            mapping[goldSym] = 'gold';

            result.d.forEach(function(q) {
                var key = mapping[q.n];
                if (!key || !q.v) return;

                var lp = q.v.lp;
                var ch = q.v.ch;
                var chp = q.v.chp;

                var priceEl = document.getElementById('idx-' + key + '-price');
                var changeEl = document.getElementById('idx-' + key + '-change');
                if (!priceEl || !changeEl) return;

                // Price — must be > 0 to display (no decimals for header)
                priceEl.textContent = (lp && lp > 0) ? Number(lp).toLocaleString('en-IN', { maximumFractionDigits: 0 }) : '—';

                // Change (sub-row)
                if (ch !== undefined && chp !== undefined && lp > 0) {
                    var sign = ch >= 0 ? '+' : '';
                    var colorClass = ch > 0 ? 'positive' : ch < 0 ? 'negative' : 'neutral';
                    changeEl.textContent = sign + Number(ch).toFixed(0) + ' (' + sign + Number(chp).toFixed(2) + '%)';
                    changeEl.className = 'index-change ' + colorClass;
                } else {
                    changeEl.textContent = '';
                    changeEl.className = 'index-change neutral';
                }
            });
        } catch (e) {
            console.log('Index ticker fetch error:', e);
        }
    }

    // Refresh index prices every 30 seconds
    var _indexRefreshTimer = null;
    function startIndexRefresh() {
        fetchIndexPrices();
        _indexRefreshTimer = setInterval(fetchIndexPrices, 30000);
    }

    // ============================================================
    // AUTH — Google OAuth via Supabase Auth
    // ============================================================

    /**
     * Check for an active Supabase Auth session.
     * If found: sets _wmsAuthToken for all REST calls, sets currentUser, returns true.
     * If not found: redirects to index.html login page.
     */
    async function checkAuth() {
        try {
            var result = await window.supabaseClient.auth.getSession();
            var session = result.data.session;
            if (!session) {
                window.location.href = 'index.html';
                return false;
            }

            // Set the auth token for all REST API calls (Phase 1A helper)
            _wmsAuthToken = session.access_token;

            // Set currentUser from the auth session
            var user = session.user;
            window.currentUser = {
                id: user.id,
                email: user.email,
                display_name: (user.user_metadata && user.user_metadata.full_name) || user.email,
                avatar_url: user.user_metadata && user.user_metadata.avatar_url
            };

            // Load preferences from the users table and merge into currentUser
            try {
                var prefRes = await fetch(
                    window.SUPABASE_URL + '/rest/v1/users?id=eq.' + user.id + '&select=preferences',
                    { headers: wmsHeaders() }
                );
                var prefRows = await prefRes.json();
                if (prefRows && prefRows[0] && prefRows[0].preferences) {
                    window.currentUser.preferences = prefRows[0].preferences;
                }
            } catch (prefErr) {
                console.warn('Could not load user preferences:', prefErr);
            }

            // Also keep wms_user in localStorage for backward compatibility
            localStorage.setItem('wms_user', JSON.stringify(window.currentUser));

            var name = window.currentUser.display_name || window.currentUser.email || 'User';
            document.getElementById('user-email').textContent = name;

            // Listen for token refresh — keep _wmsAuthToken in sync
            window.supabaseClient.auth.onAuthStateChange(function(event, newSession) {
                if (event === 'TOKEN_REFRESHED' && newSession) {
                    _wmsAuthToken = newSession.access_token;
                } else if (event === 'SIGNED_OUT') {
                    _wmsAuthToken = null;
                    localStorage.removeItem('wms_user');
                    window.location.href = 'index.html';
                }
            });

            return true;
        } catch (e) {
            console.error('Auth check failed:', e);
            window.location.href = 'index.html';
            return false;
        }
    }

    // ============================================================
    // ACCESS CONTROL (Phase 1) — load the signed-in user's capabilities and gate the nav.
    // The DATABASE is the real gate (RLS: owner OR wms_has(cap)); this only hides tabs the
    // user can't use. Owner (by email) always sees everything. See migration 57 + ACCESS-CONTROL-PLAN.md.
    // ============================================================
    var WMS_OWNER_EMAIL = 'vikash.bagla@gmail.com';
    var WMS_MODULE_CAP = {
        'trading':             'trading:read',
        'automation':          'auto_trading:read',
        'reports':             'reports:read',
        'accounting':          'accounting:read',
        'import-transactions': 'trading:write',
        'master-data':         'master:read'
    };
    window.wmsAccess = { isOwner: true, caps: null, scopes: {} };   // safe default until loaded

    // Load the current user's grants (RLS self_read returns only their own rows).
    async function wmsLoadAccess() {
        var email = (window.currentUser && window.currentUser.email) || '';
        if (email === WMS_OWNER_EMAIL) { window.wmsAccess = { isOwner: true, caps: null, scopes: {} }; return; }
        var caps = {}, scopes = {};
        try {
            var res = await fetch(window.SUPABASE_URL + '/rest/v1/app_grants?email=eq.' +
                encodeURIComponent(email) + '&select=capability,scope', { headers: wmsHeaders() });
            var rows = res.ok ? await res.json() : [];
            (rows || []).forEach(function (r) { caps[r.capability] = true; scopes[r.capability] = r.scope || {}; });
        } catch (e) { console.warn('[access] grant load failed — fail-closed to no access:', e); }
        window.wmsAccess = { isOwner: false, caps: caps, scopes: scopes };
    }

    function wmsHasModule(moduleName) {
        if (window.wmsAccess && window.wmsAccess.isOwner) return true;
        var cap = WMS_MODULE_CAP[moduleName];
        return !!(cap && window.wmsAccess && window.wmsAccess.caps && window.wmsAccess.caps[cap]);
    }

    // Hide nav entries the user isn't granted. Returns the de-duplicated list of allowed modules.
    function wmsApplyAccessGating() {
        if (window.wmsAccess && window.wmsAccess.isOwner) {
            return ['trading', 'automation', 'reports', 'accounting', 'import-transactions', 'master-data'];
        }
        var allowed = [];
        document.querySelectorAll('.nav-btn[data-module]').forEach(function (btn) {
            var mod = btn.dataset.module;
            if (wmsHasModule(mod)) { if (allowed.indexOf(mod) === -1) allowed.push(mod); btn.style.display = ''; }
            else { btn.style.display = 'none'; btn.classList.add('disabled'); }
        });
        document.querySelectorAll('#wmsBottomNav .bnav-item[data-module]').forEach(function (btn) {
            if (!wmsHasModule(btn.dataset.module)) btn.style.display = 'none';
        });
        if (allowed.length === 0) wmsShowNoAccess();
        return allowed;
    }

    function wmsShowNoAccess() {
        document.querySelectorAll('.top-nav, .wms-bottom-nav').forEach(function (n) { n.style.display = 'none'; });
        var name = (window.currentUser && (window.currentUser.display_name || window.currentUser.email)) || 'You';
        var overlay = document.createElement('div');
        overlay.id = 'wmsNoAccess';
        overlay.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:99999;overflow:auto;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
        overlay.innerHTML = '<div style="max-width:520px;margin:14vh auto;text-align:center;color:#374151;padding:0 20px">' +
            '<div style="font-size:44px">🔒</div>' +
            '<h2 style="margin:14px 0 6px">Access not set up</h2>' +
            '<p style="color:#6b7280;line-height:1.5">' + name + ', your sign-in worked, but no modules have been granted to your account yet. ' +
            'Please contact the owner to be given access.</p>' +
            '<button id="wmsNoAccessSignout" style="margin-top:18px;padding:9px 22px;border:0;border-radius:8px;background:#111827;color:#fff;cursor:pointer;font-size:14px">Sign out</button>' +
            '</div>';
        document.body.appendChild(overlay);
        var b = document.getElementById('wmsNoAccessSignout');
        if (b) b.addEventListener('click', function () { logout(); });
    }

    // Logout — uses Supabase Auth signOut
    async function logout() {
        if (confirm('Logout?')) {
            await window.supabaseClient.auth.signOut();
            _wmsAuthToken = null;
            localStorage.removeItem('wms_user');
            window.location.href = 'index.html';
        }
    }

    // Helper to inject a module's HTML + styles into the container
    function injectModule(html, container) {
        const parsed = new DOMParser().parseFromString(html, 'text/html');
        // Inject any <style> tags from <head>
        parsed.querySelectorAll('head style').forEach(style => {
            const existing = document.getElementById(style.id);
            if (existing) existing.remove();
            document.head.appendChild(style.cloneNode(true));
        });
        container.innerHTML = parsed.body.innerHTML;
    }

    // Helper to load a script dynamically
    function loadScript(src) {
        return new Promise((resolve, reject) => {
            // Remove old instance if exists
            const old = document.querySelector(`script[src="${src}"]`);
            if (old) old.remove();

            const script = document.createElement('script');
            script.src = src + '?t=' + Date.now(); // cache bust
            script.onload = resolve;
            script.onerror = reject;
            document.body.appendChild(script);
        });
    }

    // Load module
    async function loadModule(moduleName) {
        // Access guard (defense-in-depth; the DB RLS is the real gate). A non-owner can never
        // load a module they aren't granted, even via a stale saved preference.
        if (typeof wmsHasModule === 'function' && !wmsHasModule(moduleName)) {
            console.warn('[access] blocked module load (not granted):', moduleName);
            return;
        }
        if (currentModule === moduleName) return;
        currentModule = moduleName;
        localStorage.setItem('wms_last_module', moduleName);  // Remember current module

        // Sync top nav (desktop)
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        const topBtn = document.querySelector(`.nav-btn[data-module="${moduleName}"]`);
        if (topBtn) topBtn.classList.add('active');

        // Sync bottom nav (mobile/tablet)
        if (typeof updateBottomNavActive === 'function') updateBottomNavActive(moduleName);
        
        const container = document.getElementById('content-container');
        container.innerHTML = '<div class="loading-module">Loading...</div>';
        
        try {
            var _cb = '?t=' + Date.now(); // cache bust for HTML modules
            if (moduleName === 'reports') {
                const html = await (await fetch('reports.html' + _cb)).text();
                injectModule(html, container);
                await loadScript('reports.js');
                if (typeof initReports === 'function') await initReports();

            } else if (moduleName === 'master-data') {
                const html = await (await fetch('master-data.html' + _cb)).text();
                injectModule(html, container);
                await loadScript('master-data.js');
                if (typeof initMasterData === 'function') initMasterData();

            } else if (moduleName === 'import-transactions') {
                const html = await (await fetch('transaction-import.html' + _cb)).text();
                injectModule(html, container);
                await loadScript('transaction-import.js');
                await loadScript('transaction-template.js');
                if (typeof initTransactionImport === 'function') initTransactionImport();

            } else if (moduleName === 'trading') {
                const html = await (await fetch('trading.html' + _cb)).text();
                injectModule(html, container);
                await loadScript('trading.js');
                if (typeof initTrading === 'function') initTrading();

            } else if (moduleName === 'automation') {
                const html = await (await fetch('automation.html' + _cb)).text();
                injectModule(html, container);
                await loadScript('automation.js');
                if (typeof initAutomation === 'function') await initAutomation();

            } else if (moduleName === 'accounting') {
                const html = await (await fetch('accounting.html' + _cb)).text();
                injectModule(html, container);
                await loadScript('accounting.js');
                await loadScript('accounting-bank-import.js');
                if (typeof initAccounting === 'function') await initAccounting();

            } else {
                container.innerHTML = '<div class="coming-soon">🚧 Coming soon!</div>';
            }
        } catch (e) {
            container.innerHTML = '<div class="error-message">Error loading module: ' + e.message + '</div>';
            console.error('Module load error:', e);
        }
    }

    // Expose loadModule globally so other modules can navigate (e.g. Reports → Trading)
    window.loadModule = loadModule;

    // Init
    document.addEventListener('DOMContentLoaded', async () => {
        // Install Excel-style "=formula" calculator on all text/number inputs.
        // Idempotent; safe zero-cost addition — only activates when the user
        // types "=" as the first character. See wms-shared.js wmsEvalFormula.
        if (typeof wmsInitFormulaInput === 'function') wmsInitFormulaInput();

        // Select entire content when a text/number input gains focus so users
        // can replace values with a single keystroke. Skips readonly / disabled
        // / non-textual inputs. See wms-shared.js wmsInitSelectOnFocus.
        if (typeof wmsInitSelectOnFocus === 'function') wmsInitSelectOnFocus();

        // Show dev banner if running in dev environment
        if (window.WMS_ENV === 'dev') {
            var devBanner = document.getElementById('devBanner');
            if (devBanner) {
                devBanner.style.display = 'block';
                document.body.style.paddingTop = '24px';
            }
            document.title = 'WMS DEV — Wealth Management System';
        }

        // checkAuth is now async — must await before loading data
        var authOk = await checkAuth();
        if (!authOk) return;

        // Access control (Phase 1): load the user's grants and gate the nav. No grants → stop.
        await wmsLoadAccess();
        var wmsAllowed = wmsApplyAccessGating();
        if (wmsAllowed.length === 0) {
            var _sl = document.getElementById('startupLoader'); if (_sl) _sl.remove();
            var _lo = document.getElementById('logoutBtn'); if (_lo) _lo.addEventListener('click', logout);
            return;   // wmsShowNoAccess() already displayed the "access not set up" screen
        }

        if (window.wmsAccess.isOwner) checkFyersAuth();   // owner: real Fyers indicator + token from the IBA
        else { window.fyersToken = 'db'; }   // read-only users: LTP/P&L come from the server-side fyers-market-data EF (which now allows authorized users). 'db' = truthy flag so the shared price refresh runs; no client Fyers token needed.

        // Show startup loader while master data loads
        var loaderEl = document.getElementById('startupLoader');
        var loaderMsg = document.getElementById('startupLoaderMsg');

        // Load all master data before activating any module
        try {
            loaderMsg.textContent = 'Loading investors, brokers & config...';
            var refPromise = wmsLoadRefData();

            loaderMsg.textContent = 'Loading securities data...';
            await Promise.all([
                refPromise,
                wmsLoadSecuritiesCm(),
                wmsLoadSecuritiesNfo()
            ]);
            console.log('All master data loaded — activating app');

            // Baseline the master change-tokens now that every master is in memory, so the
            // background cadence (wmsMastersSyncNow) can delta them going forward (§A.4.4b).
            // No-ops harmlessly until the masters_sync_state migration is applied.
            if (typeof wmsMastersCaptureBaseline === 'function') { try { await wmsMastersCaptureBaseline(); } catch (e) {} }

            // Preload the ONE shared transactions cache (LESSONS §A.9.6) now that
            // securities are available (search-text enrichment needs the CM cache).
            // Every module reads this same cache — Trading, Reports, etc. — so they
            // can never diverge, and no module fetches transactions itself. Loaded
            // AFTER auth + master data so RLS + enrichment are in place.
            loaderMsg.textContent = 'Loading transactions...';
            await wmsLoadTransactions();
        } catch (e) {
            console.error('Startup load error (activating anyway; modules will load on demand):', e);
        }

        // Fade out and remove startup loader
        loaderEl.classList.add('fade-out');
        setTimeout(function() { loaderEl.remove(); }, 350);

        // Background: load debt securities (NCD, GOVT_BOND) — non-blocking
        wmsLoadSecuritiesDebt();

        startIndexRefresh(); // Start index ticker
        document.getElementById('logoutBtn').addEventListener('click', logout);
        // One refresh entry point for the whole app — used by the header 🔄 button AND F5.
        // Dispatches to the ACTIVE module's own refresh; modules without one are re-rendered.
        function wmsRefreshActiveModule() {
            var mod = currentModule;
            try {
                if (mod === 'accounting' && typeof acctRefreshAll === 'function') { acctRefreshAll(); return; }
                if (mod === 'reports' && typeof rptRefresh === 'function') { rptRefresh(); return; }
                if (mod === 'trading' && typeof trRefresh === 'function') { trRefresh(); return; }
                // No dedicated refresh (automation / master-data / import): re-render the module.
                if (mod && typeof loadModule === 'function') { var m = mod; currentModule = null; loadModule(m); }
            } catch (e) { console.error('[refresh] failed', e); }
        }
        window.wmsRefreshActiveModule = wmsRefreshActiveModule;
        document.getElementById('appRefreshBtn').addEventListener('click', wmsRefreshActiveModule);

        // Show-zero: one control (header 👁 button + F6) toggles zero-value rows for the ACTIVE module.
        function wmsShowZeroState() {
            var mod = currentModule;
            if (mod === 'accounting' && typeof acctFinShowZero !== 'undefined') return acctFinShowZero;
            if (mod === 'reports') {
                if (typeof rptConsolIsActive === 'function' && rptConsolIsActive() && typeof rptConsShowZero !== 'undefined') return rptConsShowZero;
                if (typeof rptShowZero !== 'undefined') return rptShowZero;
            }
            if (mod === 'trading' && typeof trShowZeroHoldings !== 'undefined') return trShowZeroHoldings;
            return false;
        }
        function wmsSyncShowZeroBtn() {
            var b = document.getElementById('appShowZeroBtn');
            if (b) b.classList.toggle('active', !!wmsShowZeroState());
        }
        window.wmsSyncShowZeroBtn = wmsSyncShowZeroBtn;
        function wmsToggleShowZeroActiveModule() {
            var mod = currentModule;
            try {
                if (mod === 'accounting' && typeof acctToggleShowZero === 'function') acctToggleShowZero();
                else if (mod === 'reports' && typeof rptToggleShowZeroActive === 'function') rptToggleShowZeroActive();
                else if (mod === 'trading' && typeof trToggleZeroHoldings === 'function') trToggleZeroHoldings();
            } catch (e) { console.error('[show-zero] failed', e); }
            wmsSyncShowZeroBtn();
        }
        window.wmsToggleShowZeroActiveModule = wmsToggleShowZeroActiveModule;
        var _szBtn = document.getElementById('appShowZeroBtn');
        if (_szBtn) _szBtn.addEventListener('click', wmsToggleShowZeroActiveModule);

        // F5 = refresh, F6 = toggle show-zero — anywhere in the app (instead of the browser defaults).
        document.addEventListener('keydown', function (e) {
            if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
            if (e.key === 'F5') { e.preventDefault(); wmsRefreshActiveModule(); }
            else if (e.key === 'F6') { e.preventDefault(); wmsToggleShowZeroActiveModule(); }
        });
        document.querySelectorAll('.nav-btn:not(.disabled)').forEach(btn => {
            btn.addEventListener('click', async () => { await loadModule(btn.dataset.module); if (typeof wmsSyncShowZeroBtn === 'function') wmsSyncShowZeroBtn(); });
        });

        // Bottom nav bar — click handler
        document.querySelectorAll('#wmsBottomNav .bnav-item').forEach(btn => {
            btn.addEventListener('click', async () => {
                const mod = btn.dataset.module;
                const subtab = btn.dataset.subtab || '';

                // Highlight active bottom nav item
                document.querySelectorAll('#wmsBottomNav .bnav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Load the module (trading or master-data)
                await loadModule(mod);

                // If there's a sub-tab (Portfolio, Watchlist, F&O, Txns), switch to it
                if (subtab && typeof trSwitchTab === 'function') {
                    trSwitchTab(subtab);
                }
            });
        });

        // Load last active module or default. Non-owners fall back to their first granted module,
        // and a saved preference the user can no longer access is ignored.
        var lastModule = localStorage.getItem('wms_last_module') || (window.wmsAccess.isOwner ? 'reports' : wmsAllowed[0]);
        if (lastModule === 'portfolio') lastModule = 'reports'; // migrate old preference
        if (wmsAllowed.indexOf(lastModule) === -1) lastModule = wmsAllowed[0];

        // Phone (≤480px) is review-first: open Trading → Portfolio when granted; else the default.
        if (window.matchMedia('(max-width:480px)').matches && wmsHasModule('trading')) {
            Promise.resolve(loadModule('trading')).then(function() {
                if (typeof trSwitchTab === 'function') trSwitchTab('tr-portfolio');
                document.querySelectorAll('#wmsBottomNav .bnav-item').forEach(function(b) { b.classList.remove('active'); });
                var pBtn = document.querySelector('#wmsBottomNav .bnav-item[data-subtab="tr-portfolio"]');
                if (pBtn) pBtn.classList.add('active');
            });
        } else {
            loadModule(lastModule);
            // Set initial bottom nav active state
            updateBottomNavActive(lastModule);
        }
    });

    // Keep bottom nav active state in sync
    function updateBottomNavActive(moduleName) {
        document.querySelectorAll('#wmsBottomNav .bnav-item').forEach(b => {
            b.classList.remove('active');
            if (b.dataset.module === moduleName) b.classList.add('active');
        });
    }
    </script>
    
    <script>
    // Cache busting - auto version by date so deployments always load fresh files
    const _v = Date.now();
    document.getElementById('app-styles-link').href = `app-styles.css?v=${_v}`;
    document.write(`<script src="utils.js?v=${_v}"><\/script>`);
    document.write(`<script src="wms-shared.js?v=${_v}"><\/script>`);
    document.write(`<script src="wms-cost-engine.js?v=${_v}"><\/script>`);
    document.write(`<script src="accounting-engine.js?v=${_v}"><\/script>`);
    document.write(`<script src="wms-txn-modal.js?v=${_v}"><\/script>`);
    document.write(`<script src="cn-viewer.js?v=${_v}"><\/script>`);
    document.write(`<script src="wms-export.js?v=${_v}"><\/script>`);
    </script>
