<body>
    <div id="loading-indicator" class="loading-overlay" style="display: none;">

    <header class="app-header">

                </div>
                <div class="index-item" id="idx-sensex">

                    <div class="index-top"><span class="index-name">GOLD</span><span class="index-price" id="idx-gold-price">—</span></div>

            <div class="user-section">

            <button class="nav-btn" data-module="master-data">🗂️ Master Database</button>
            <button class="nav-btn" data-module="import-transactions">📥 Import Transactions</button>

            <button class="nav-btn disabled" data-module="other-transactions">📋 Other Transactions</button>

    <!-- Bottom Nav Bar (visible on tablet & phone via CSS media query) -->

        <button class="bnav-item" data-module="trading" data-subtab="tr-transactions">

        </button>
        <button class="bnav-item" data-module="master-data">

    <script>
    // Global configuration - ONLY DECLARED ONCE
    window.SUPABASE_URL = 'https://lynvrwteylgpwlwbslse.supabase.co';
    window.SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5bnZyd3RleWxncHdsd2JzbHNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwOTI4NDMsImV4cCI6MjA4NTY2ODg0M30.zHMouEjak_Fpd9LBqHbSOifVfSCZ0U8AqrX94C9oKXc';
    
    // Initialize Supabase
    const { createClient } = supabase;
    window.supabaseClient = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    
    let currentModule = null;
    window.currentUser = null;

    // ============================================================
    // FYERS TOKEN MANAGEMENT
    // ============================================================

    // Get today's token from localStorage if still valid
    function getFyersToken() {
        try {
            const stored = localStorage.getItem('fyers_token');
            if (!stored) return null;
            const { token, date } = JSON.parse(stored);
            const today = new Date().toISOString().split('T')[0];
            if (date === today && token) return token;
            return null; // expired (different date)
        } catch (e) {
            return null;
        }
    }

    // Call Fyers via Supabase Edge Function
    // Pass the locally stored token in the request body
    window.fyersCall = async function(payload) {
        const stored = localStorage.getItem('fyers_token');
        let fyersToken = null;
        if (stored) {
            try {
                const { token, date } = JSON.parse(stored);
                const today = new Date().toISOString().split('T')[0];
                if (date === today) fyersToken = token;
            } catch(e) {}
        }

        const response = await fetch(`${window.SUPABASE_URL}/functions/v1/fyers-market-data`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${window.SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({ ...payload, accessToken: fyersToken })
        });
        return await response.json();
    };

    // Check for today's token in investor_broker_accounts (auto-login)
    async function checkFyersDbToken() {
        try {
            const today = new Date().toISOString().split('T')[0];
            const res = await fetch(
                `${window.SUPABASE_URL}/rest/v1/investor_broker_accounts?api_token_date=eq.${today}&api_access_token=not.is.null&select=api_access_token,api_token_method,api_token_generated_at,api_last_error&limit=1`,
                {
                    headers: {
                        'apikey': window.SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${window.SUPABASE_ANON_KEY}`
                    }
                }
            );
            if (!res.ok) return null;
            const rows = await res.json();
            if (rows && rows.length > 0 && rows[0].api_access_token) return rows[0];
        } catch (e) {
            console.warn('DB token check failed:', e);
        }
        return null;
    }

    // Check Fyers token on app load
    // Priority: localStorage (manual OAuth) → DB (auto-login) → not connected
    async function checkFyersAuth() {
        const statusEl = document.getElementById('fyers-status');

        // 1. Check localStorage first (manual OAuth)
        const localToken = getFyersToken();
        if (localToken) {
            window.fyersToken = localToken;
            console.log('✅ Fyers token valid for today (localStorage)');
            statusEl.innerHTML = '🟢 Fyers';
            statusEl.style.color = '#059669';
            return;
        }

        // 2. Check DB for auto-login token
        const dbRow = await checkFyersDbToken();
        if (dbRow && dbRow.api_access_token) {
            // Auto-login token exists — edge function will use it automatically
            window.fyersToken = 'db';  // truthy flag; actual token used server-side
            const method = dbRow.api_token_method === 'auto' ? 'auto-login' : 'manual';
            console.log(`✅ Fyers token valid for today (DB, ${method})`);
            statusEl.innerHTML = '🟢 Fyers <span style="font-size:9px;color:#6b7280;">(auto)</span>';
            statusEl.style.color = '#059669';
            return;
        }

        // 3. No token available
        window.fyersToken = null;
        statusEl.innerHTML =
            '🔴 <a href="fyers-oauth.html" style="color:#dc2626;font-weight:600;">Fyers</a>';
        console.log('⚠️ Fyers token missing or expired');
    }

    // ============================================================
    // INDEX TICKER
    // ============================================================

    // ---- Gold symbol resolver (auto-detects active near-month contract) ----
    var _resolvedGoldSymbol = null;

    function buildGoldCandidates() {
        var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
        var now = new Date();
        var candidates = [];
        for (var i = 0; i < 4; i++) {
            var d = new Date(now.getFullYear(), now.getMonth() + i, 1);
            var yy = String(d.getFullYear()).slice(2);
            candidates.push('MCX:GOLDM' + yy + months[d.getMonth()] + 'FUT');
        }
        return candidates;
    }

    async function resolveGoldSymbol() {
        if (_resolvedGoldSymbol) return _resolvedGoldSymbol;
        var candidates = buildGoldCandidates();
        for (var i = 0; i < candidates.length; i++) {
            try {
                var res = await window.fyersCall({ action: 'quotes', symbols: [candidates[i]] });
                if (res && res.d && res.d[0] && res.d[0].v && res.d[0].v.lp > 0) {
                    _resolvedGoldSymbol = candidates[i];
                    console.log('✅ Gold symbol resolved:', _resolvedGoldSymbol);
                    return _resolvedGoldSymbol;
                }
            } catch(e) {}
        }
        return candidates[0]; // fallback to first candidate
    }

    // ---- Fetch and display NIFTY, BANKNIFTY, SENSEX, GOLD prices ----
    async function fetchIndexPrices() {
        try {
            // Check localStorage token OR DB token (auto-login sets window.fyersToken = 'db')
            var token = getFyersToken() || window.fyersToken;
            if (!token) return;

            // Resolve gold symbol (cached after first success)
            var goldSym = await resolveGoldSymbol();

            var symbols = [
                'NSE:NIFTY50-INDEX',
                'NSE:NIFTYBANK-INDEX',
                'BSE:SENSEX-INDEX',
                goldSym
            ];

            var result = await window.fyersCall({ action: 'quotes', symbols: symbols });
            if (!result || !result.d) return;

            // Dynamic mapping — gold symbol may vary
            var mapping = {
                'NSE:NIFTY50-INDEX':    'nifty',
                'NSE:NIFTYBANK-INDEX':  'banknifty',
                'BSE:SENSEX-INDEX':     'sensex'
            };
            mapping[goldSym] = 'gold';

            result.d.forEach(function(q) {
                var key = mapping[q.n];
                if (!key || !q.v) return;

                var lp = q.v.lp;
                var ch = q.v.ch;
                var chp = q.v.chp;

                var priceEl = document.getElementById('idx-' + key + '-price');
                var changeEl = document.getElementById('idx-' + key + '-change');
                if (!priceEl || !changeEl) return;

                // Price — must be > 0 to display (no decimals for header)
                priceEl.textContent = (lp && lp > 0) ? Number(lp).toLocaleString('en-IN', { maximumFractionDigits: 0 }) : '—';

                // Change (sub-row)
                if (ch !== undefined && chp !== undefined && lp > 0) {
                    var sign = ch >= 0 ? '+' : '';
                    var colorClass = ch > 0 ? 'positive' : ch < 0 ? 'negative' : 'neutral';
                    changeEl.textContent = sign + Number(ch).toFixed(0) + ' (' + sign + Number(chp).toFixed(2) + '%)';
                    changeEl.className = 'index-change ' + colorClass;
                } else {
                    changeEl.textContent = '';
                    changeEl.className = 'index-change neutral';
                }
            });
        } catch (e) {
            console.log('Index ticker fetch error:', e);
        }
    }

    // Refresh index prices every 30 seconds
    var _indexRefreshTimer = null;
    function startIndexRefresh() {
        fetchIndexPrices();
        _indexRefreshTimer = setInterval(fetchIndexPrices, 30000);
    }

    // ============================================================
    // AUTH
    // ============================================================
    function checkAuth() {
        const savedUser = localStorage.getItem('wms_user');
        if (!savedUser) {
            window.location.href = 'index.html';
            return false;
        }
        
        try {
            window.currentUser = JSON.parse(savedUser);
            const name = window.currentUser.display_name || window.currentUser.name || window.currentUser.username || window.currentUser.email || 'User';
            document.getElementById('user-email').textContent = name;
            return true;
        } catch (e) {
            localStorage.removeItem('wms_user');
            window.location.href = 'index.html';
            return false;
        }
    }

    // Logout
    function logout() {
        if (confirm('Logout?')) {
            localStorage.removeItem('wms_user');
            window.location.href = 'index.html';
        }
    }

    // Helper to inject a module's HTML + styles into the container
    function injectModule(html, container) {
        const parsed = new DOMParser().parseFromString(html, 'text/html');
        // Inject any <style> tags from <head>
        parsed.querySelectorAll('head style').forEach(style => {
            const existing = document.getElementById(style.id);
            if (existing) existing.remove();
            document.head.appendChild(style.cloneNode(true));
        });
        container.innerHTML = parsed.body.innerHTML;
    }

    // Helper to load a script dynamically
    function loadScript(src) {
        return new Promise((resolve, reject) => {
            // Remove old instance if exists
            const old = document.querySelector(`script[src="${src}"]`);
            if (old) old.remove();

            const script = document.createElement('script');
            script.src = src + '?t=' + Date.now(); // cache bust
            script.onload = resolve;
            script.onerror = reject;
            document.body.appendChild(script);
        });
    }

    // Load module
    async function loadModule(moduleName) {
        if (currentModule === moduleName) return;
        currentModule = moduleName;
        localStorage.setItem('wms_last_module', moduleName);  // Remember current module

        // Sync top nav (desktop)
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        const topBtn = document.querySelector(`.nav-btn[data-module="${moduleName}"]`);
        if (topBtn) topBtn.classList.add('active');

        // Sync bottom nav (mobile/tablet)
        if (typeof updateBottomNavActive === 'function') updateBottomNavActive(moduleName);
        
        const container = document.getElementById('content-container');
        container.innerHTML = '<div class="loading-module">Loading...</div>';
        
        try {
            var _cb = '?t=' + Date.now(); // cache bust for HTML modules
            if (moduleName === 'portfolio') {
                const resp = await fetch('portfolio.html' + _cb);
                container.innerHTML = await resp.text();
                if (typeof initPortfolio === 'function') await initPortfolio();

            } else if (moduleName === 'master-data') {
                const html = await (await fetch('master-data.html' + _cb)).text();
                injectModule(html, container);
                await loadScript('master-data.js');
                if (typeof initMasterData === 'function') initMasterData();

            } else if (moduleName === 'import-transactions') {
                const html = await (await fetch('transaction-import.html' + _cb)).text();
                injectModule(html, container);
                await loadScript('transaction-import.js');
                await loadScript('transaction-template.js');
                if (typeof initTransactionImport === 'function') initTransactionImport();

            } else if (moduleName === 'trading') {
                const html = await (await fetch('trading.html' + _cb)).text();
                injectModule(html, container);
                await loadScript('trading.js');
                if (typeof initTrading === 'function') initTrading();

            } else {
                container.innerHTML = '<div class="coming-soon">🚧 Coming soon!</div>';
            }
        } catch (e) {
            container.innerHTML = '<div class="error-message">Error loading module: ' + e.message + '</div>';
            console.error('Module load error:', e);
        }
    }

    // Init
    document.addEventListener('DOMContentLoaded', async () => {
        if (!checkAuth()) return;
        checkFyersAuth();

        // Show startup loader while master data loads
        var loaderEl = document.getElementById('startupLoader');
        var loaderMsg = document.getElementById('startupLoaderMsg');

        // Load all master data before activating any module
        try {
            loaderMsg.textContent = 'Loading investors, brokers & config...';
            var refPromise = wmsLoadRefData();

            loaderMsg.textContent = 'Loading securities data...';
            await Promise.all([
                refPromise,
                wmsLoadSecuritiesCm(),
                wmsLoadSecuritiesNfo()
            ]);
            console.log('All master data loaded — activating app');
        } catch (e) {
            console.error('Master data load error (activating anyway):', e);
        }

        // Fade out and remove startup loader
        loaderEl.classList.add('fade-out');
        setTimeout(function() { loaderEl.remove(); }, 350);

        // Background: load debt securities (NCD, GOVT_BOND) — non-blocking
        wmsLoadSecuritiesDebt();

        startIndexRefresh(); // Start index ticker
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('appRefreshBtn').addEventListener('click', function() {
            if (typeof trRefresh === 'function') trRefresh();
        });
        document.querySelectorAll('.nav-btn:not(.disabled)').forEach(btn => {
            btn.addEventListener('click', () => loadModule(btn.dataset.module));
        });

        // Bottom nav bar — click handler
        document.querySelectorAll('#wmsBottomNav .bnav-item').forEach(btn => {
            btn.addEventListener('click', async () => {
                const mod = btn.dataset.module;
                const subtab = btn.dataset.subtab || '';

                // Highlight active bottom nav item
                document.querySelectorAll('#wmsBottomNav .bnav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Load the module (trading or master-data)
                await loadModule(mod);

                // If there's a sub-tab (Portfolio, Watchlist, F&O, Txns), switch to it
                if (subtab && typeof trSwitchTab === 'function') {
                    trSwitchTab(subtab);
                }
            });
        });

        // Load last active module or default to portfolio
        const lastModule = localStorage.getItem('wms_last_module') || 'portfolio';
        loadModule(lastModule);

        // Set initial bottom nav active state
        updateBottomNavActive(lastModule);
    });

    // Keep bottom nav active state in sync
    function updateBottomNavActive(moduleName) {
        document.querySelectorAll('#wmsBottomNav .bnav-item').forEach(b => {
            b.classList.remove('active');
            if (b.dataset.module === moduleName) b.classList.add('active');
        });
    }
    </script>
    
    <script>
    // Cache busting - auto version by date so deployments always load fresh files
    const _v = Date.now();
    document.getElementById('app-styles-link').href = `app-styles.css?v=${_v}`;
    document.write(`<script src="utils.js?v=${_v}"><\/script>`);
    document.write(`<script src="wms-shared.js?v=${_v}"><\/script>`);
    document.write(`<script src="portfolio.js?v=${_v}"><\/script>`);
    </script>
</body>
