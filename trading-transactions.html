<!-- Trading Transactions Sub-Module HTML -->
<style id="trading-transactions-styles">
/* ================================================================
   TRANSACTIONS TAB STYLES
   ================================================================ */

/* Row styling for flagged transactions */
.trTx-hidden-row { opacity: 0.5; }
.trTx-hidden-row td { text-decoration: line-through; }
.trTx-hidden-row td.action-cell,
.trTx-hidden-row td.action-cell * { text-decoration: none; }
.trTx-hidden-row td.trTx-checkbox-cell,
.trTx-hidden-row td.trTx-checkbox-cell * { text-decoration: none; }

/* Type badge */
.trTx-type-badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 600;
}

/* Clickable rows */
#trTx-list tr[data-txn-id] { cursor: pointer; }
#trTx-list tr[data-txn-id]:hover { background: #f7fafc; }

/* Options bar */
.trTx-options-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 6px 10px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    flex-shrink: 0;
    flex-wrap: wrap;
}
.trTx-options-bar label {
    font-size: 11px;
    color: #4a5568;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
}
.trTx-options-bar label input[type="checkbox"] {
    margin: 0;
    cursor: pointer;
}
.trTx-option-separator {
    width: 1px;
    height: 18px;
    background: #cbd5e0;
    flex-shrink: 0;
}
.trTx-toggle-group {
    display: flex;
    align-items: center;
    gap: 2px;
    background: #e2e8f0;
    border-radius: 4px;
    padding: 1px;
}
.trTx-toggle-group .trTx-toggle-btn {
    padding: 2px 10px;
    font-size: 11px;
    font-weight: 500;
    border: none;
    background: transparent;
    color: #718096;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
}
.trTx-toggle-group .trTx-toggle-btn.active {
    background: #fff;
    color: #2d3748;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}
.trTx-fifo-lifo-group {
    display: none;
}
.trTx-fifo-lifo-group.visible {
    display: flex;
}

/* Date filter right-aligned spacer */
.trTx-options-spacer { flex: 1; }

/* Icon-only action menu — tight column */
#trTx-list .action-cell,
#trTx-table .action-cell {
    width: 24px;
    max-width: 24px;
    padding: 2px 2px !important;
    text-align: center;
    position: relative;
    overflow: visible;
}
#trTx-list .action-menu {
    min-width: auto;
    width: auto;
    padding: 2px 0;
}
#trTx-list .action-menu-item {
    padding: 4px 8px;
    font-size: 14px;
    text-align: center;
    display: inline-block;
    width: auto;
}
#trTx-list .action-menu-item.disabled {
    opacity: 0.35;
    cursor: not-allowed;
}
#trTx-list .action-menu-item.disabled:hover {
    background: none;
}

/* Checkbox column */
.trTx-checkbox-cell {
    width: 24px;
    max-width: 24px;
    padding: 2px 4px !important;
    text-align: center;
}
.trTx-checkbox-cell input[type="checkbox"] {
    margin: 0;
    cursor: pointer;
}

/* Bulk action bar */
.trTx-bulk-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 10px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 6px;
    margin-bottom: 4px;
    flex-shrink: 0;
}
.trTx-bulk-bar .trTx-bulk-count {
    font-size: 11px;
    font-weight: 600;
    color: #dc2626;
}
.trTx-bulk-bar button {
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid #e2e8f0;
    background: white;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
}
.trTx-bulk-bar button:hover {
    border-color: #667eea;
    color: #667eea;
}
.trTx-bulk-bar button.danger {
    border-color: #fecaca;
    color: #dc2626;
}
.trTx-bulk-bar button.danger:hover {
    background: #fee2e2;
    border-color: #dc2626;
}

/* Matching trades table */
#trTx-matching-container { display: none; }
#trTx-matching-container.visible { display: flex; flex-direction: column; }
#trTx-list-container.hidden { display: none; }

/* Collapsible group header row */
.trTx-match-group-header {
    cursor: pointer;
    user-select: none;
}
.trTx-match-group-header:hover td {
    background: #edf2f7 !important;
}
.trTx-match-group-header td {
    background: #f7fafc;
    font-weight: 600;
    font-size: 11px;
    color: #2d3748;
    padding: 6px 8px !important;
    border-bottom: 1px solid #e2e8f0;
    border-top: 1px solid #e2e8f0;
}
.trTx-match-group-header .trTx-collapse-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 14px;
    height: 14px;
    font-size: 10px;
    color: #718096;
    transition: transform 0.15s;
    vertical-align: middle;
}
.trTx-match-group-header.collapsed .trTx-collapse-icon {
    transform: rotate(-90deg);
}
/* Detail rows — very light background for table-like look */
.trTx-match-detail-row td {
    background: #fcfcfd;
}
.trTx-match-detail-row.collapsed-row {
    display: none;
}
.trTx-match-open td {
    color: #718096;
    font-style: italic;
}
.trTx-pnl-positive { color: #059669; font-weight: 600; }
.trTx-pnl-negative { color: #dc2626; font-weight: 600; }

/* Totals in group header */
.trTx-group-total {
    font-weight: 600;
    font-size: 11px;
}

/* Visual gap between buy and sell blocks */
#trTx-matching-table .trTx-buy-start {
    border-left: 2px solid #cbd5e0;
    padding-left: 12px !important;
}
#trTx-matching-table thead th.trTx-buy-start {
    border-left: 2px solid #cbd5e0;
    padding-left: 12px !important;
}
#trTx-matching-table .trTx-sell-start {
    border-left: 2px solid #cbd5e0;
    padding-left: 12px !important;
}
#trTx-matching-table thead th.trTx-sell-start {
    border-left: 2px solid #cbd5e0;
    padding-left: 12px !important;
}

/* Eye icon for hiding rows in matching view */
.trTx-match-eye-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 13px;
    padding: 0 2px;
    opacity: 0.4;
    transition: opacity 0.15s;
}
.trTx-match-eye-btn:hover { opacity: 1; }
.trTx-match-detail-row.trTx-view-hidden { display: none; }

/* Contract detail column */
.trTx-contract-detail {
    font-size: 10px;
    color: #667eea;
    font-weight: 500;
}
</style>

<!-- Options bar with date filter right-aligned -->
<div class="trTx-options-bar" style="flex-shrink:0; margin-bottom:6px;">
    <label title="Show hidden (dont_display) transactions">
        <input type="checkbox" id="trTx-show-all"> Show All
    </label>
    <label title="Show only F&O transactions">
        <input type="checkbox" id="trTx-fno-only"> F&O Only
    </label>
    <div class="trTx-option-separator"></div>
    <span style="font-size:11px; color:#718096;">View:</span>
    <div class="trTx-toggle-group" id="trTx-view-toggle">
        <button class="trTx-toggle-btn active" data-view="list">List</button>
        <button class="trTx-toggle-btn" data-view="matching">Matching Trades</button>
    </div>
    <div class="trTx-fifo-lifo-group trTx-toggle-group" id="trTx-match-method-toggle">
        <button class="trTx-toggle-btn" data-method="fifo">FIFO</button>
        <button class="trTx-toggle-btn active" data-method="lifo">LIFO</button>
    </div>
    <div class="trTx-options-spacer"></div>
    <div id="trTx-date-filter" style="display:inline-flex;"></div>
</div>

<!-- Filters — 5-column: Symbol + 4 × wmsPillSearch containers -->
<div class="filters-grid" style="flex-shrink:0; grid-template-columns: repeat(5, 1fr);">
    <div class="filter-group">
        <div class="filter-header">
            <label>Search Symbol</label>
            <span class="clear-link" id="trTx-clear-symbol" style="visibility:hidden;">Clear</span>
        </div>
        <div class="filter-search-container">
            <input type="text" class="filter-search-input" id="trTx-symbol-search" placeholder="Symbol or company...">
        </div>
    </div>
    <div id="trTx-filter-investor"></div>
    <div id="trTx-filter-trader"></div>
    <div id="trTx-filter-broker"></div>
    <div id="trTx-filter-tag"></div>
</div>

<!-- Bulk action bar (hidden by default) -->
<div id="trTx-bulk-bar" class="trTx-bulk-bar" style="display:none;">
    <span class="trTx-bulk-count" id="trTx-bulk-count">0 selected</span>
    <button id="trTx-bulk-hide" title="Hide selected transactions from display">👁 Hide</button>
    <button id="trTx-bulk-delete" class="danger" title="Delete selected transactions">🗑️ Delete</button>
    <button id="trTx-bulk-clear" style="margin-left:auto; border:none; background:none; color:#718096; font-size:11px; cursor:pointer;">✕ Clear selection</button>
</div>

<!-- Transaction count -->
<div style="flex-shrink:0; padding: 2px 0 4px; display:flex; justify-content:space-between; align-items:center;">
    <span id="trTx-count" style="font-size:11px; color:#718096;">Showing 0 transactions</span>
</div>

<!-- List view table -->
<div id="trTx-list-container" class="table-container" style="flex:1; min-height:0; overflow:auto;">
    <table id="trTx-table">
        <thead>
            <tr>
                <th class="trTx-checkbox-cell" style="width:24px; max-width:24px;">
                    <input type="checkbox" id="trTx-select-all" title="Select all">
                </th>
                <th class="sortable" id="trTx-th-date" style="width:8%;">
                    Date <span class="sort-indicator" id="trTx-sort-date">▼</span>
                </th>
                <th class="sortable" id="trTx-th-investor" style="width:12%;">
                    Inv > Trd > Brk <span class="sort-indicator" id="trTx-sort-investor"></span>
                </th>
                <th class="sortable" id="trTx-th-symbol" style="width:18%;">
                    Symbol <span class="sort-indicator" id="trTx-sort-symbol"></span>
                </th>
                <th style="width:5%; text-align:center;">Type</th>
                <th class="text-right" style="width:6%;">Qty</th>
                <th class="text-right" style="width:8%;">Traded Price</th>
                <th class="text-right" style="width:8%;">Net Price</th>
                <th class="text-right" style="width:10%;">Net Amount</th>
                <th style="width:11%;">Tags</th>
                <th class="action-cell" style="width:24px; max-width:24px;">⋮</th>
            </tr>
        </thead>
        <tbody id="trTx-list">
            <tr><td colspan="11" style="text-align:center;padding:40px;color:#9ca3af;">Loading transactions...</td></tr>
        </tbody>
    </table>
</div>

<!-- Matching trades view table -->
<div id="trTx-matching-container" class="table-container" style="flex:1; min-height:0; overflow:auto;">
    <table id="trTx-matching-table">
        <thead>
            <tr>
                <th style="width:11%;">Inv @ Broker</th>
                <th style="width:7%;">Contract</th>
                <th class="text-right" style="width:5%;">Qty</th>
                <th class="trTx-buy-start" style="width:8%;">Buy Date</th>
                <th class="text-right" style="width:7%;">Buy Avg</th>
                <th class="text-right" style="width:10%;">Buy Amount</th>
                <th class="trTx-sell-start" style="width:8%;">Sell Date</th>
                <th class="text-right" style="width:7%;">Sell Avg</th>
                <th class="text-right" style="width:9%;">Sell Amount</th>
                <th class="text-right" style="width:9%;">Net P&L</th>
                <th style="width:25px;"></th>
            </tr>
        </thead>
        <tbody id="trTx-matching-list">
        </tbody>
    </table>
</div>
