<script>
        // Supabase configuration
        const SUPABASE_URL = 'https://lynvrwteylgpwlwbslse.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5bnZyd3RleWxncHdsd2JzbHNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwOTI4NDMsImV4cCI6MjA4NTY2ODg0M30.zHMouEjak_Fpd9LBqHbSOifVfSCZ0U8AqrX94C9oKXc';

        let currentUser = null;

        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('wms_user');
            if (savedUser) {
                // User already logged in, redirect to app
                window.location.href = 'app.html';
            }
        });

        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');

            // Show loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = 'Signing in<span class="spinner"></span>';
            errorMessage.classList.remove('show');

            try {
                // Query users table
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users?email=eq.${encodeURIComponent(email)}&select=*`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                const users = await response.json();

                if (users && users.length > 0) {
                    const user = users[0];
                    
                    // Check password (stored in database)
                    if (user.password && user.password === password) {
                        currentUser = user;
                        
                        // Save to localStorage
                        localStorage.setItem('wms_user', JSON.stringify(user));
                        
                        // Redirect to app
                        window.location.href = 'app.html';
                    } else {
                        throw new Error('Invalid password');
                    }
                } else {
                    throw new Error('User not found');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'Invalid email or password. Please try again.';
                errorMessage.classList.add('show');
                
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Sign In';
            }
        });

        // Signup form handler
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;
            const signupBtn = document.getElementById('signupBtn');
            const errorMessage = document.getElementById('signupErrorMessage');

            // Validate passwords match
            if (password !== passwordConfirm) {
                errorMessage.textContent = 'Passwords do not match';
                errorMessage.classList.add('show');
                return;
            }

            // Show loading state
            signupBtn.disabled = true;
            signupBtn.innerHTML = 'Creating account<span class="spinner"></span>';
            errorMessage.classList.remove('show');

            try {
                // Check if user already exists
                const checkResponse = await fetch(`${SUPABASE_URL}/rest/v1/users?email=eq.${encodeURIComponent(email)}&select=id`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                const existingUsers = await checkResponse.json();
                
                if (existingUsers && existingUsers.length > 0) {
                    throw new Error('An account with this email already exists');
                }

                // Create new user
                const createResponse = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password,
                        is_active: true
                    })
                });

                if (!createResponse.ok) {
                    const errorData = await createResponse.json();
                    throw new Error(errorData.message || 'Failed to create account');
                }

                const newUsers = await createResponse.json();
                
                if (newUsers && newUsers.length > 0) {
                    currentUser = newUsers[0];
                    
                    // Save to localStorage
                    localStorage.setItem('wms_user', JSON.stringify(currentUser));
                    
                    // Redirect to app
                    window.location.href = 'app.html';
                } else {
                    throw new Error('Account created but could not log in');
                }
            } catch (error) {
                console.error('Signup error:', error);
                errorMessage.textContent = error.message || 'Failed to create account. Please try again.';
                errorMessage.classList.add('show');
                
                signupBtn.disabled = false;
                signupBtn.innerHTML = 'Create Account';
            }
        });

        // Show signup form
        function showSignup() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'flex';
            document.getElementById('signupErrorMessage').classList.remove('show');
        }

        // Show login form
        function showLogin() {
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'flex';
            document.getElementById('errorMessage').classList.remove('show');
        }
</script>
